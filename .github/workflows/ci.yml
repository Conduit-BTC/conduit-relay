name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check immutable workflow dependencies
        run: |
          ruby scripts/check-action-pins-test.rb
          ruby scripts/check-action-pins.rb
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            legacy/go.sum
            congee/go.sum
            congee/sdk/plugin/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: congee/web/admin/package-lock.json
      - name: Build Congee admin UI
        working-directory: congee/web/admin
        run: npm ci && npm run build
      - name: Build Congee
        working-directory: congee
        run: go build ./...
      - name: Build plugin SDK
        working-directory: congee/sdk/plugin
        run: go build ./...
      - name: Build legacy relay
        working-directory: legacy
        run: go build ./...
      - name: Check recipient protection
        working-directory: congee
        run: >-
          go test -count=1
          -run 'GiftWrap|NIP17|NIP42|NEG.*(Protected|GiftWrap|Private|Group)|EventVisib|REQPlugin'
          ./internal/relay ./internal/config ./internal/nip77/upstream
      - name: Check legacy protection, sync recovery, and credential boundary
        working-directory: legacy
        run: go test -count=1 -run 'GiftWrap|TestPublicAgentCredentialBoundary|TestProjectionDelete|TestProductQueriesKeepRelayIndexesSeparate|TestRelaySyncerBackfill|TestRelaySyncerLoadStateRecovery|TestSyncStateReplacement' .
