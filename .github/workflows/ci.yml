name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            go.sum
            congee/go.sum
            congee/sdk/plugin/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: congee/web/admin/package-lock.json
      - name: Build Congee admin UI
        working-directory: congee/web/admin
        run: npm ci && npm run build
      - name: Build Congee
        working-directory: congee
        run: go build ./...
      - name: Build plugin SDK
        working-directory: congee/sdk/plugin
        run: go build ./...
      - name: Build legacy relay
        run: go build ./...
      - name: Check recipient protection
        working-directory: congee
        run: >-
          go test -count=1
          -run 'GiftWrap|NIP17|NIP42|NEG.*(Protected|GiftWrap|Private|Group)|EventVisib|REQPlugin'
          ./internal/relay ./internal/config ./internal/nip77/upstream
      - name: Check legacy recipient protection and credential boundary
        run: go test -count=1 -run 'GiftWrap|TestPublicAgentCredentialBoundary' .
