name: Agent PR Harden

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to harden
        required: true
        type: string
      task:
        description: Specific fix or hardening task
        required: true
        type: string
      risk_class:
        description: Risk class for the work
        required: true
        default: B
        type: choice
        options:
          - A
          - B
          - C

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: agent-pr-harden-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  harden:
    if: contains(fromJSON('["dylangolow","conduitdevelopers","kevin-kinkade"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate pull request and maintainer gate
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RISK_CLASS: ${{ inputs.risk_class }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Pull request number must be a positive integer." >&2
            exit 1
          fi
          metadata="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"             --json baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels,state             --jq '[.baseRefName // "", .headRefName // "", .headRefOid // "", ((.isCrossRepository == true) | tostring), ((.isDraft == true) | tostring), .state // "", ([.labels[].name] | join(","))] | join("\u001f")')"
          IFS=$'\x1f' read -r base_ref head_ref head_sha is_cross_repo is_draft state labels <<< "$metadata"

          labels="${labels,,}"
          effective_risk="$RISK_CLASS"
          if [[ ",$labels," == *",risk:C,"* ]]; then
            effective_risk="C"
          elif [[ ",$labels," == *",risk:B,"* && "$effective_risk" == "A" ]]; then
            effective_risk="B"
          fi

          if [[ "$effective_risk" == "C" ]]; then
            echo "Risk class C requires human-owned planning before agent code changes." >&2
            exit 1
          fi

          if [[ "$is_cross_repo" == "true" ]]; then
            echo "Agent hardening is disabled for cross-repository pull requests." >&2
            exit 1
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "Agent hardening requires a pull request targeting main." >&2
            exit 1
          fi
          if [[ "$is_draft" == "true" || "$state" != "OPEN" || -z "$head_ref" || -z "$head_sha" ]]; then
            echo "Agent hardening requires an open, ready pull request with a resolvable head." >&2
            exit 1
          fi
          if [[ ",$labels," != *",agent-ready,"* && ",$labels," != *",agent-fix,"* ]]; then
            echo "Add agent-ready or agent-fix before running code-changing agent hardening." >&2
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "risk_class=$effective_risk" >> "$GITHUB_OUTPUT"

      - name: Require automation credentials
        shell: bash
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GITHUB_APP_CLIENT_ID: ${{ vars.WORKFLOW_AGENT_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_AGENT_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$CODEX_AUTH_JSON" ]] || { echo "CODEX_AUTH_JSON is required." >&2; exit 1; }
          [[ -n "$GITHUB_APP_CLIENT_ID" ]] || { echo "WORKFLOW_AGENT_GITHUB_APP_CLIENT_ID is required." >&2; exit 1; }
          [[ -n "$GITHUB_APP_PRIVATE_KEY" ]] || { echo "WORKFLOW_AGENT_GITHUB_APP_PRIVATE_KEY is required." >&2; exit 1; }

      - name: Create GitHub App hardening token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WORKFLOW_AGENT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_AGENT_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout immutable pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Attach checked-out SHA to pull request branch
        shell: bash
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: git switch -C "$HEAD_REF" "$HEAD_SHA"

      - name: Run Sudden Agent hardening
        uses: sudden-network/agent@2afabe84ac9bf58e57f605b41b2c4f87bbe9c579 # v1.14.1
        with:
          agent_auth_file: ${{ secrets.CODEX_AUTH_JSON }}
          github_token: ${{ steps.app_token.outputs.token }}
          github_token_actor: ${{ format('{0}[bot]', steps.app_token.outputs['app-slug']) }}
          model: ${{ vars.WORKFLOW_AGENT_CODEX_MODEL || 'gpt-5.6-sol/xhigh' }}
          resume: false
          sudo: true
          prompt: |
            Harden Conduit-BTC/conduit-relay PR
            #${{ steps.pr.outputs.number }} at immutable starting head
            ${{ steps.pr.outputs.head_sha }} on branch
            ${{ steps.pr.outputs.head_ref }}.

            Task:
            ${{ inputs.task }}

            Risk class: ${{ steps.pr.outputs.risk_class }}

            You may edit files and push focused commits to the pull request
            branch. Do not merge, deploy, alter secrets, change labels, or
            broaden the task. Do not change workflow files unless the task
            explicitly requests workflow changes.

            Preserve Nostr interoperability, kind-1059 recipient isolation,
            NIP-42 authentication, internal-call boundaries, concurrency
            safety, and the one-Machine/one-volume deployment constraint.

            Required validation before pushing:
            - gofmt on touched Go files
            - go vet ./...
            - go build ./...
            - go test -count=1 ./...
            - go test -race -count=1 ./...
            - git diff --check

            Never add secrets, private runbooks, Nostr secret keys, wallet
            credentials, event payload logs, or unbounded user text to tracked
            files.
